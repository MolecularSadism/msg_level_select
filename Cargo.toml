[package]
name = "msg_level_select"
version = "0.3.1"
edition = "2024"
description = "Procedural FTL-style level map generator with ECS-driven traversal state."
license = "MIT OR Apache-2.0"
repository = "https://github.com/MolecularSadism/msg_level_select"
keywords = ["bevy", "gamedev", "procedural", "level-select", "map"]
categories = ["game-engines"]
readme = "README.md"

[features]
dev = ["dep:bevy-inspector-egui", "bevy/bevy_gizmos"]
# Derive `Serialize`/`Deserialize` on the config types (struct-level
# `#[serde(default)]` backed by the `Default` impls), so a game can embed
# `LevelMapConfig` directly in its own config files.
serde = ["dep:serde"]

[dependencies]
# No default features: this crate is pure ECS/math/reflect data and logic —
# rendering, UI, audio, asset loading etc. are the consuming game's concern.
bevy = { version = "0.18", default-features = false, features = [
    "std",
    "bevy_log",
    "bevy_camera",
] }
bevy_fsm = "0.5.0"
voronoice = "0.2"
rand = "0.10"
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"

[dev-dependencies]
# Round-trip and partial-deserialize tests for the `serde` feature.
ron = "0.10"

[dependencies.bevy-inspector-egui]
version = "0.36"
optional = true

[[example]]
name = "basic"
path = "examples/basic.rs"
required-features = ["dev"]
